[project]
name = "sam-med3d-pancreas-adaptation"
version = "0.1.0"
description = "Parameter-efficient adaptation of SAM-Med3D for 3D pancreatic / pancreatic tumor segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raju Sah" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy 3D deps are installed on Kaggle GPU, NOT on the local dev machine.
kaggle = [
  "torch>=2.2",
  "monai>=1.3",
  "nibabel>=5.0",
  "SimpleITK>=2.3",
  "einops>=0.8",
]
dev = [
  "pytest>=8.0",
  # Equivalence-test deps (tests skip gracefully if absent):
  "torchio>=1.0",  # direct ZNormalization equivalence (test_preprocess.py)
  "monai>=1.4",  # MONAI pipeline builder test (test_preprocess.py)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
